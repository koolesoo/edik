  <rect x="470" y="584" width="180" height="48" class="task"/>
  <text x="560" y="610" class="tx">Статистика по match_id</text>

  <rect x="746" y="326" width="200" height="56" class="task"/>
  <text x="846" y="348" class="tx">Маппинг и нормализация</text>
  <text x="846" y="362" class="tx">(поля API → UI)</text>

  <rect x="784" y="250" width="164" height="44" class="task"/>
