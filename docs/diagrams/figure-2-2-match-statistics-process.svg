  <text x="510" y="24" class="ttl">Рисунок 2.2 — BPMN-диаграмма процесса получения статистики матча</text>

  <rect x="28" y="40" width="964" height="722" class="pool"/>
  <line x1="28" y1="142" x2="992" y2="142" class="ln"/>
  <line x1="28" y1="472" x2="992" y2="472" class="ln"/>
  <line x1="28" y1="572" x2="992" y2="572" class="ln"/>

  <text x="40" y="98" class="lb">Пользователь</text>
  <text x="40" y="182" class="lb">Клиент (MatchStatsPage + api.js)</text>
  <text x="40" y="508" class="lb">Сервер (Flask)</text>
  <text x="40" y="608" class="lb">LiveScore API</text>

  <text x="220" y="122" class="note">Выбор матча → navigate('/match-stats', state)</text>

