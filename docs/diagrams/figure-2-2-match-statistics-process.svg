  <path d="M866,250 L866,218 L784,218" class="f"/>
  <path d="M784,272 L784,716 L959,716" class="f"/>
  <path d="M734,240 L784,272" class="f"/>

  <text x="598" y="176" class="lbl">нет</text>
  <text x="624" y="240" class="lbl">да</text>
