<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="780" viewBox="0 0 1020 780">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#1a365d"/>
    </marker>
    <style><![CDATA[
      .pool { fill: #f8fafc; stroke: #2c5282; stroke-width: 2; rx: 3; }
      .ln { stroke: #cbd5e0; stroke-width: 1; }
      .lb { font-family: system-ui, "Segoe UI", Arial, sans-serif; font-size: 12px; fill: #1a202c; font-weight: 600; }
      .task { fill: #fff; stroke: #2b6cb0; stroke-width: 1.5; rx: 6; }
      .tx { font-family: system-ui, "Segoe UI", Arial, sans-serif; font-size: 10px; fill: #1a202c; text-anchor: middle; }
      .gw { fill: #fffbeb; stroke: #b7791f; stroke-width: 1.5; }
      .se { fill: #e6fffa; stroke: #2c7a7b; stroke-width: 2; }
      .ee { fill: #fff5f5; stroke: #c53030; stroke-width: 2; }
      .f { stroke: #2d3748; stroke-width: 1.2; fill: none; marker-end: url(#a); }
      .ttl { font-family: system-ui, "Segoe UI", Arial, sans-serif; font-size: 13.5px; fill: #1a202c; font-weight: 700; text-anchor: middle; }
      .note { font-family: system-ui, "Segoe UI", Arial, sans-serif; font-size: 9px; fill: #718096; }
      .lbl { font-family: system-ui, "Segoe UI", Arial, sans-serif; font-size: 9px; fill: #4a5568; }
    ]]></style>
