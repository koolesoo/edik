<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="640" viewBox="0 0 920 640">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#1a365d"/>
    </marker>
    <style><![CDATA[
      .ttl { font-family: system-ui, "Segoe UI", Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #1a202c; text-anchor: middle; }
      .box { fill: #edf2f7; stroke: #2b6cb0; stroke-width: 1.5; rx: 8; }
      .gw { fill: #fffbeb; stroke: #c05621; stroke-width: 1.5; }
      .note { fill: #f0fff4; stroke: #276749; stroke-width: 1.2; rx: 6; }
      .tx { font-family: system-ui, "Segoe UI", Arial, sans-serif; font-size: 10.5px; fill: #1a202c; text-anchor: middle; }
      .sm { font-family: system-ui, "Segoe UI", Arial, sans-serif; font-size: 9px; fill: #4a5568; }
      .f { stroke: #2d3748; stroke-width: 1.2; fill: none; marker-end: url(#ar); }
      .lbl { font-family: system-ui, "Segoe UI", Arial, sans-serif; font-size: 9px; fill: #718096; }
    ]]></style>
  </defs>

  <text x="460" y="28" class="ttl">Scheme: in-flight request deduplication (cachedRequest)</text>

  <rect x="280" y="48" width="360" height="44" class="box"/>
  <text x="460" y="68" class="tx">Parallel callers with same cache key K</text>
  <text x="460" y="82" class="sm">getMatches / getMatchStatistics / ... -> cachedRequest(K, ...)</text>

  <polygon points="432,118 488,152 432,186 376,152" class="gw"/>
  <text x="460" y="138" class="sm">Fresh cache?</text>

  <rect x="520" y="124" width="200" height="52" class="box"/>
  <text x="620" y="146" class="tx">Return cached payload</text>
  <text x="620" y="162" class="sm">localStorage, TTL ok</text>

  <polygon points="432,226 488,260 432,294 376,260" class="gw"/>
  <text x="348" y="256" class="lbl">no</text>
  <text x="498" y="170" class="lbl">yes</text>

  <polygon points="432,334 488,368 432,402 376,368" class="gw"/>
  <text x="460" y="356" class="sm">inflightByKey.has(K)?</text>

  <rect x="520" y="326" width="220" height="84" class="box"/>
  <text x="630" y="352" class="tx">return inflightByKey.get(K)</text>
  <text x="630" y="372" class="sm">same Promise for all waiters</text>
  <text x="630" y="392" class="sm">one HTTP round-trip</text>

  <rect x="48" y="318" width="260" height="100" class="box"/>
  <text x="178" y="348" class="tx">Create async task</text>
  <text x="178" y="366" class="sm">inflightByKey.set(K, promise)</text>
  <text x="178" y="384" class="sm">await requestFn()</text>
  <text x="178" y="402" class="sm">setApiCacheEntry; finally delete(K)</text>

  <rect x="120" y="468" width="640" height="72" class="note"/>
  <text x="440" y="492" class="tx">Map stores K -&gt; Promise while the request is in flight; after settle, entry removed in finally.</text>
  <text x="440" y="510" class="sm">Source: football-stats/src/services/api.js — cachedRequest</text>

  <circle cx="460" cy="598" r="10" fill="#fff" stroke="#c53030" stroke-width="2"/>
  <circle cx="460" cy="598" r="5" fill="#c53030"/>

  <path d="M460,92 L432,118" class="f"/>
  <path d="M488,152 L520,150" class="f"/>
  <path d="M432,186 L432,226" class="f"/>
  <path d="M488,260 L488,334" class="f"/>
  <path d="M488,368 L520,368" class="f"/>
  <path d="M376,368 L308,368" class="f"/>
  <path d="M178,418 L178,448 L460,588" class="f"/>
  <path d="M630,410 L460,588" class="f"/>
  <path d="M620,176 L620,588 L472,598" class="f"/>

  <text x="300" y="318" class="lbl">no</text>
  <text x="498" y="322" class="lbl">yes</text>
</svg>
