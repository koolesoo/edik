<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="760" viewBox="0 0 920 760">
  <defs>
    <marker id="bwa" markerWidth="7" markerHeight="7" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L6,2.5 z" fill="#000"/>
    </marker>
    <marker id="bwd" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6" fill="none" stroke="#000" stroke-width="1"/>
    </marker>
    <style><![CDATA[
      .title { font-family: "Times New Roman", Times, serif; font-size: 13pt; font-weight: 700; fill: #000; text-anchor: middle; }
      .sub { font-family: "Times New Roman", Times, serif; font-size: 9pt; fill: #000; text-anchor: middle; font-style: italic; }
      .lbl { font-family: "Times New Roman", Times, serif; font-size: 10pt; font-weight: 700; fill: #000; }
      .tx { font-family: "Times New Roman", Times, serif; font-size: 9pt; fill: #000; text-anchor: middle; }
      .sm { font-family: "Times New Roman", Times, serif; font-size: 8pt; fill: #000; text-anchor: middle; }
      .box { fill: #fff; stroke: #000; stroke-width: 1.2; }
      .nest { fill: #fafafa; stroke: #000; stroke-width: 1; }
      .solid { stroke: #000; stroke-width: 1; fill: none; marker-end: url(#bwa); }
      .dash { stroke: #000; stroke-width: 1; fill: none; stroke-dasharray: 5 4; marker-end: url(#bwd); }
      .note { font-family: "Times New Roman", Times, serif; font-size: 8.5pt; fill: #000; text-anchor: start; }
    ]]></style>
  </defs>

  <text x="460" y="30" class="title">Рисунок — архитектура backend API на Flask</text>
  <text x="460" y="48" class="sub">прокси-слой к внешнему поставщику данных (REST, JSON)</text>

  <text x="40" y="84" class="lbl">Конфигурация при старте</text>
  <rect x="40" y="90" width="300" height="40" class="box"/>
  <text x="190" y="114" class="tx">python-dotenv — загрузка .env</text>

  <rect x="360" y="72" width="520" height="68" class="nest"/>
  <text x="620" y="88" class="lbl">Приложение Flask</text>
  <rect x="372" y="96" width="240" height="36" class="box"/>
  <text x="492" y="118" class="tx">Flask(__name__), порт 5001</text>
  <rect x="628" y="96" width="240" height="36" class="box"/>
  <text x="748" y="118" class="tx">flask-cors — CORS(app)</text>

  <text x="40" y="162" class="lbl">Маршруты GET /api/livescore/rpl</text>
  <rect x="40" y="170" width="840" height="210" class="nest"/>
  <rect x="52" y="182" width="252" height="34" class="box"/>
  <text x="178" y="202" class="tx">…/live</text>
  <rect x="316" y="182" width="252" height="34" class="box"/>
  <text x="442" y="202" class="tx">…/matches ?date=</text>
  <rect x="580" y="182" width="288" height="34" class="box"/>
  <text x="724" y="202" class="tx">…/standings</text>
  <rect x="52" y="224" width="252" height="34" class="box"/>
  <text x="178" y="244" class="tx">…/team-matches ?team=</text>
  <rect x="316" y="224" width="552" height="34" class="box"/>
  <text x="592" y="244" class="tx">…/match-stats ?match_id=</text>
  <rect x="52" y="268" width="816" height="100" class="box"/>
  <text x="460" y="292" class="tx">Обработчик: request.args, jsonify, коды 400 / 502 / 500, logging</text>
  <text x="460" y="312" class="sm">вызов функций модуля livescore_api (делегирование)</text>
  <text x="460" y="330" class="sm">единый JSON для SPA</text>

  <text x="40" y="400" class="lbl">Модуль livescore_api.py</text>
  <rect x="40" y="408" width="420" height="180" class="nest"/>
  <rect x="52" y="420" width="396" height="40" class="box"/>
  <text x="250" y="444" class="tx">Учётные данные: os.environ</text>
  <rect x="52" y="470" width="396" height="40" class="box"/>
  <text x="250" y="494" class="tx">HTTPS: urllib, ssl, certifi</text>
  <rect x="52" y="520" width="396" height="60" class="box"/>
  <text x="250" y="544" class="tx">fetch_* — запрос и нормализация ответа</text>
  <text x="250" y="562" class="sm">возврат (данные, err)</text>

  <text x="480" y="400" class="lbl">Внешний поставщик</text>
  <rect x="480" y="408" width="400" height="120" class="nest"/>
  <rect x="492" y="420" width="376" height="100" class="box"/>
  <text x="680" y="448" class="tx">LiveScore API (HTTPS)</text>
  <text x="680" y="468" class="sm">api-client; key/secret только на сервере</text>
  <text x="680" y="488" class="sm">исходящий вызов из livescore_api</text>

  <text x="40" y="612" class="lbl">Входящий контур</text>
  <rect x="40" y="620" width="200" height="48" class="box"/>
  <text x="140" y="642" class="tx">SPA → GET /api</text>
  <text x="140" y="658" class="sm">без ключей провайдера</text>

  <path d="M460,278 L250,408" class="solid"/>
  <path d="M430,580 L680,520" class="dash"/>
  <path d="M140,620 L140,280" class="dash"/>

  <text x="40" y="702" class="note">Сплошная стрелка: вызов Python-функции из обработчика. Пунктир: HTTP — от SPA к Flask и от сервера к LiveScore.</text>
</svg>
